<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Valóranos | Cuby Movie</title>
  <link rel="stylesheet" href="css/css_Proyecto.css">
</head>

<body>

<header>
  <h1>Valora tu experiencia</h1>
  <p>Cuéntanos tus gustos para recomendarte mejores películas</p>
</header>

<main class="cuestionario">

  <section>
    <h2>Tus preferencias</h2>

    <form>
      <label>
        Género favorito:
        <select>
          <option>Acción</option>
          <option>Aventura/Fantasía</option>
          <option>Animación</option>
          <option>Comedia</option>
          <option>Terror/Misterio</option>
          <option>Drama</option>
          <option>Ciencia Ficción</option>
          <option>Otros</option>
        </select>
      </label>

      <label>
        ¿Te gustan las películas largas?
      </label>
        <input type="checkbox"> Sí
        <input type="checkbox"> No
      <label>
        ¿Cuál es tu tiempo ideal de duración para una película?
        <select>
          <option>Menos de 1 hora</option>
          <option>De 1 hora a 1 hora y media</option>
          <option>Entre 1 hora y media a 2 horas</option>
          <option>Más de 2 horas</option>
        </select>
      </label>

      <label>
        ¿Sueles ver cine solo o acompañado?
        <select>
          <option>Solo</option>
          <option>En pareja</option>
          <option>Con amigos</option>
        </select>
      </label>

      <label>
        ¿Qué es lo que más valoras de una película?
        <select>
          <option>Guión</option>
          <option>Trama</option>
          <option>Personajes</option>
          <option>Efectos Cinematográficos</option>
          <option>Banda Sonora</option>
          <option>Otro</option>
        </select>
      </label>

       <label>
        ¿En qué te fijas primero para ver una película?
        <select>
          <option>Tráiler</option>
          <option>Comentarios</option>
          <option>Recomendación</option>
          <option>Anuncios</option>
          <option>Reparto</option>
          <option>Otro</option>
        </select>
      </label>

      <button type="submit">Enviar</button>
    </form>
  </section>

</main>

<footer>
  <p>Autor: Claudia Santana Ortiz</p>
</footer>

</body>
